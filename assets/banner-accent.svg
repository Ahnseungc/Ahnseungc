<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-label="dot to line accent">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="55%" stop-color="#0c1219"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e8b8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00e8b8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00b894" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e8b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="140" fill="url(#bg)"/>
  <g fill="#00e8b8" opacity="0.12">
    <circle cx="80" cy="70" r="2"/><circle cx="160" cy="70" r="2"/><circle cx="240" cy="70" r="2"/>
    <circle cx="320" cy="70" r="2"/><circle cx="400" cy="70" r="2"/><circle cx="480" cy="70" r="2"/>
    <circle cx="560" cy="70" r="2"/><circle cx="640" cy="70" r="2"/><circle cx="720" cy="70" r="2"/>
    <circle cx="800" cy="70" r="2"/><circle cx="880" cy="70" r="2"/><circle cx="960" cy="70" r="2"/>
    <circle cx="1040" cy="70" r="2"/><circle cx="1120" cy="70" r="2"/>
  </g>
  <path d="M 120 70 Q 360 20 600 70 T 1080 70" fill="none" stroke="url(#line)" stroke-width="2.5" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <circle cx="120" cy="70" r="6" fill="#00e8b8" opacity="0.95"/>
    <circle cx="360" cy="42" r="5" fill="#00e8b8" opacity="0.75"/>
    <circle cx="600" cy="70" r="7" fill="#00e8b8"/>
    <circle cx="840" cy="98" r="5" fill="#00b894" opacity="0.8"/>
    <circle cx="1080" cy="70" r="6" fill="#00e8b8" opacity="0.95"/>
  </g>
  <text x="600" y="118" text-anchor="middle" fill="#7a8a9a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="0.28em">DOT &#8594; LINE &#8594; PRODUCT</text>
</svg>
